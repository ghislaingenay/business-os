# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - pydantic-settings>=2.0.0
          - sqlalchemy>=2.0.0
          - fastapi>=0.104.0
          - dependency-injector>=4.41.0
          - boto3>=1.34.0
          - redis>=5.0.0
          - arq>=0.26.0
          - pillow>=10.0.0
        # No `--strict` here: pyproject.toml's `[tool.mypy]` already sets
        # `strict = true` plus deliberate per-flag relaxations (e.g.
        # `disallow_any_generics = false`) — passing `--strict` on the CLI
        # would override those relaxations, since CLI flags win over config
        # file settings.
        exclude: ^(tests/|alembic/)

  - repo: local
    hooks:
      - id: check-env-example
        name: check .env.example exists
        entry: bash -c 'test -f .env.example || (echo ".env.example file is missing" && exit 1)'
        language: system
        pass_filenames: false
