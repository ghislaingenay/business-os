services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: business_os
      POSTGRES_PASSWORD: business_os
      POSTGRES_DB: business_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: arq worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://business_os:business_os@postgres:5432/business_os
      STORAGE_PROVIDER: minio
      S3_BUCKET: uploads
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
  redis-data:
